<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080b14">
  <title>GlowCaption AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="badge">GLOWCAPTION AI</div>
      <h1>Auto captions that <span>GLOW ✨</span></h1>
      <p>Local browser transcription. No API key or upload server required.</p>
    </header>

    <section class="card">
      <label class="upload" id="dropZone">
        <input id="videoInput" type="file" accept="video/*,audio/*">
        <strong>Choose a video or audio file</strong>
        <span>or drag & drop it here</span>
      </label>

      <div id="fileInfo" class="file-info hidden"></div>

      <div class="controls-grid">
        <label>
          Language
          <select id="language">
            <option value="auto">Auto detect</option>
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="ur">Urdu</option>
            <option value="bn">Bengali</option>
            <option value="ta">Tamil</option>
            <option value="te">Telugu</option>
            <option value="mr">Marathi</option>
            <option value="gu">Gujarati</option>
            <option value="pa">Punjabi</option>
            <option value="ar">Arabic</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
          </select>
        </label>
        <label>
          Caption size
          <input id="fontSize" type="range" min="20" max="64" value="34">
        </label>
        <label>
          Caption position
          <select id="position">
            <option value="bottom">Bottom</option>
            <option value="middle">Middle</option>
            <option value="top">Top</option>
          </select>
        </label>
      </div>

      <button id="transcribeBtn" class="primary" disabled>Generate captions</button>

      <div id="status" class="status hidden">
        <div class="status-row"><span id="statusText">Preparing…</span><span id="percent">0%</span></div>
        <progress id="progress" value="0" max="100"></progress>
        <small id="detail"></small>
      </div>
    </section>

    <section id="previewCard" class="card hidden">
      <div class="section-title">Preview</div>
      <div id="videoStage" class="video-stage">
        <video id="video" controls playsinline></video>
        <div id="captionOverlay" class="caption-overlay"></div>
      </div>
      <div class="caption-list-wrap">
        <div class="section-title">Captions</div>
        <div id="captionList" class="caption-list"></div>
      </div>
      <div class="actions">
        <button id="downloadSrt" disabled>Download SRT</button>
        <button id="downloadVtt" disabled>Download VTT</button>
        <button id="clearBtn" class="danger">Start over</button>
      </div>
    </section>

    <footer>Best results: clear speech, low background noise, and a modern Chrome/Edge browser.</footer>
  </main>

  <script type="module" src="app.js"></script>
</body>
</html>
