<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ClipForge AI</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <div class="badge">AI SHORT CLIP MAKER</div>
      <h1>Turn a video into<br><span>Shorts in seconds.</span></h1>
      <p>Paste a YouTube URL for a video you own or have permission to use. The backend finds strong moments, creates vertical clips, and adds captions.</p>
    </section>

    <section class="card">
      <label for="url">YouTube video URL</label>
      <div class="row">
        <input id="url" type="url" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off">
        <button id="generate">Generate Clips</button>
      </div>
      <div class="options">
        <label>Clips <select id="count"><option>3</option><option selected>5</option><option>10</option></select></label>
        <label>Length <select id="length"><option value="30">30 sec</option><option value="45" selected>45 sec</option><option value="60">60 sec</option></select></label>
      </div>
      <p id="status" class="status"></p>
    </section>

    <section id="results" class="results"></section>
  </main>
  <script src="app.js"></script>
</body>
</html>
