<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#080a10">
  <title>GLOWING.AI — Caption Studio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand"><span class="brand-star">✦</span> GLOWING<span>.AI</span></div>
      <div class="top-actions">
        <button id="undoBtn" class="icon-btn" title="Undo">↶</button>
        <button id="redoBtn" class="icon-btn" title="Redo">↷</button>
        <button id="exportSrtBtn" class="export-btn">Export SRT</button>
      </div>
    </header>

    <main class="workspace">
      <section class="preview-panel">
        <div class="preview-toolbar">
          <span class="live-dot"></span><span>PREVIEW</span>
          <div class="ratio">
            <button data-ratio="9:16" class="active">9:16</button>
            <button data-ratio="1:1">1:1</button>
            <button data-ratio="16:9">16:9</button>
          </div>
        </div>

        <div id="stage" class="stage ratio-916">
          <video id="video" playsinline preload="metadata"></video>
          <div id="captionOverlay" class="caption-overlay" aria-live="polite"></div>
          <div id="emptyPreview" class="empty-preview">
            <div class="empty-icon">▶</div>
            <strong>Choose a video or audio</strong>
            <span>Upload MP4/WebM/MOV to start</span>
          </div>
        </div>

        <div class="scrubber-row">
          <span id="currentTime">0:00</span>
          <input id="scrubber" type="range" min="0" max="0" step="0.01" value="0">
          <span id="duration">0:00</span>
        </div>
        <div class="player-row">
          <button id="playBtn" class="play-btn">▶</button>
          <input id="volume" type="range" min="0" max="1" step=".01" value=".9">
        </div>
      </section>

      <aside class="editor-panel">
        <div class="upload-row">
          <label class="upload-btn">＋ Choose video or audio<input id="fileInput" type="file" accept="video/*,audio/*"></label>
          <span id="fileName" class="file-name">No file selected</span>
        </div>

        <div class="primary-actions">
          <button id="generateBtn" class="primary">Generate from transcript</button>
          <button id="addCaptionBtn">＋ Add caption</button>
          <button id="clearBtn">Clear</button>
        </div>

        <div class="transcript-box">
          <label for="transcript">Transcript for caption generation</label>
          <textarea id="transcript" rows="3" placeholder="Paste the spoken text here. The app will split it into timed caption segments."></textarea>
          <div class="hint">This version never invents speech. Browser-only automatic transcription from an uploaded video's audio needs a speech-to-text engine/API.</div>
          <div class="secondary-actions">
            <button id="importSrtBtn">Import SRT</button>
            <input id="srtInput" type="file" accept=".srt,text/plain" hidden>
            <button id="micBtn">🎙 Live speech</button>
          </div>
        </div>

        <nav class="tabs">
          <button class="tab active" data-tab="styles">Styles</button>
          <button class="tab" data-tab="fonts">Fonts</button>
          <button class="tab" data-tab="animation">Animation</button>
          <button class="tab" data-tab="captions">Captions</button>
        </nav>

        <section id="stylesTab" class="tab-panel active"></section>
        <section id="fontsTab" class="tab-panel"></section>
        <section id="animationTab" class="tab-panel"></section>
        <section id="captionsTab" class="tab-panel"></section>
      </aside>
    </main>
  </div>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
